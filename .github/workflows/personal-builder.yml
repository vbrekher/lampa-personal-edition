name: Lampa Personal Edition verification
on:
  push:
    branches: [main, feature/personal-edition-builder]
    paths:
      - 'personal/**'
      - 'i18n/**'
      - 'src/**'
      - 'tools/i18n*.mjs'
      - 'README.md'
      - 'docs/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'package.json'
      - 'src/interaction/extensions/**'
      - 'src/interaction/settings/**'
      - '.github/workflows/personal-builder.yml'
  pull_request:
    paths:
      - 'personal/**'
      - 'i18n/**'
      - 'src/**'
      - 'tools/i18n*.mjs'
      - 'README.md'
      - 'docs/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'package.json'
      - 'src/interaction/extensions/**'
      - 'src/interaction/settings/**'
      - '.github/workflows/personal-builder.yml'
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install upstream build dependencies
        run: npm install --no-fund
      - name: Run unit and packaging tests
        run: npm run test:personal
      - name: Report exact translation completeness (drafts are not published)
        run: npm run i18n:report
      - name: Save reproducible localization evidence
        run: node tools/i18n-evidence.mjs
      - name: Upload localization review queues
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-evidence
          path: reports/localization/
      - name: Compile real upstream Lampa and create a generic smoke WGT
        run: |
          if ! npm run build:personal -- --language ru --plugins off; then
            echo '=== Sanitized public-source build diagnostic ==='
            if [ -f dist/build-error.log ]; then sed -n '1,180p' dist/build-error.log; fi
            exit 1
          fi
      - name: Verify smoke artifact without publishing it
        run: |
          unzip -tq dist/Lampa-Personal-Edition.wgt
          unzip -p dist/Lampa-Personal-Edition.wgt index.html | grep 'personal-config.js'
          unzip -p dist/Lampa-Personal-Edition.wgt config.xml | grep 'L4mpaPers0.LampaPersonal'
          if unzip -Z -1 dist/Lampa-Personal-Edition.wgt | grep -Fx 'loader.js'; then
            echo 'Remote loader unexpectedly packaged'
            exit 1
          fi
          rm -f dist/Lampa-Personal-Edition.wgt
      - name: Dependency vulnerability audit (must reach zero before release)
        run: npm audit --audit-level=low
      # Only public-source audit evidence is uploaded; personal WGT packages are not.
