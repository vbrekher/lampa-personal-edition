name: Bug report
description: Report a reproducible personal build or Samsung compatibility issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload your personal WGT, certificates, passwords, authenticated stream URLs or tokens."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Please list exact steps and the redacted error.
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model / Tizen version
      placeholder: "e.g. Samsung UE43DU7100UXUA / Tizen 9"
  - type: input
    id: platform
    attributes:
      label: Build computer and Node version
      placeholder: "e.g. macOS, Node 22"
  - type: dropdown
    id: phase
    attributes:
      label: Where does it fail?
      options:
        - npm install
        - Builder / packaging
        - Apps2Samsung installation
        - App launch
        - Catalogue
        - Video playback
        - Other
